// ---- localStorage-backed shim for window.storage (same interface used by the app) ----
window.storage = {
  get: async (key) => {
    const v = localStorage.getItem(key);
    return v === null ? null : { key, value: v, shared: false };
  },
  set: async (key, value) => {
    localStorage.setItem(key, value);
    return { key, value, shared: false };
  },
  delete: async (key) => { localStorage.removeItem(key); return { key, deleted: true, shared: false }; },
  list: async (prefix) => {
    const keys = Object.keys(localStorage).filter((k) => !prefix || k.startsWith(prefix));
    return { keys, prefix, shared: false };
  },
};

function formatMoney(amount, symbol = "Rs. ") {
  const n = Number(amount) || 0;
  const neg = n < 0;
  const abs = Math.abs(n).toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 0 });
  return `${neg ? "-" : ""}${symbol}${abs}`;
}
function formatDate(iso) {
  return new Date(iso).toLocaleDateString(undefined, { day: "2-digit", month: "short", year: "numeric" });
}
function formatTime(iso) {
  return new Date(iso).toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
}
function formatDateTime(iso) { return `${formatDate(iso)} · ${formatTime(iso)}`; }
function startOfDay(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
function endOfDay(d) { const x = new Date(d); x.setHours(23, 59, 59, 999); return x; }
function inRange(iso, from, to) {
  const t = new Date(iso).getTime();
  return (!from || t >= from.getTime()) && (!to || t <= to.getTime());
}
function nextReceiptNumber(counter) { return `INV-${String(counter).padStart(6, "0")}`; }

function getRangeDates(range) {
  const now = new Date();
  if (range === "today") return { from: startOfDay(now), to: endOfDay(now) };
  if (range === "yesterday") { const y = new Date(now); y.setDate(y.getDate() - 1); return { from: startOfDay(y), to: endOfDay(y) }; }
  if (range === "week") { const w = new Date(now); w.setDate(w.getDate() - 7); return { from: startOfDay(w), to: endOfDay(now) }; }
  if (range === "month") { const m = new Date(now); m.setDate(m.getDate() - 30); return { from: startOfDay(m), to: endOfDay(now) }; }
  return { from: null, to: null };
}

// Ascending ledger with running balance for one customer
function ledgerWithRunning(customer, allTxns) {
  if (!customer) return [];
  const txns = allTxns
    .filter((t) => t.customerId === customer.id)
    .slice()
    .sort((a, b) => new Date(a.date) - new Date(b.date) || a.createdAt - b.createdAt);
  let running = Number(customer.openingBalance) || 0;
  const rows = [];
  for (const t of txns) {
    running += t.type === "credit" ? Number(t.amount) : -Number(t.amount);
    rows.push({ ...t, runningBalance: running });
  }
  return rows;
}
function getBalance(customer, allTxns) {
  const rows = ledgerWithRunning(customer, allTxns);
  return rows.length ? rows[rows.length - 1].runningBalance : Number(customer.openingBalance) || 0;
}

function buildWhatsAppLink(phone, message) {
  const clean = (phone || "").replace(/[^0-9+]/g, "").replace(/^\+/, "");
  return `https://wa.me/${clean}?text=${encodeURIComponent(message)}`;
}
function downloadFile(filename, text, type = "application/json") {
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

// ---------------------------- Small UI atoms --------------------------------
function GlassCard({ className = "", style = {}, children, onClick }) {
  return <div className={`glass rounded-3xl ${className}`} style={style} onClick={onClick}>{children}</div>;
}

function Btn({ children, onClick, variant = "primary", className = "", disabled, style = {} }) {
  const base = "px-4 py-2.5 rounded-2xl font-semibold text-sm transition active:scale-95 flex items-center justify-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed";
  const variants = {
    primary: { background: "var(--accent)", color: "#1A1204" },
    ghost: { background: "var(--glass-bg)", color: "var(--text-primary)", border: "1px solid var(--glass-border)" },
    danger: { background: "rgba(251,113,133,0.15)", color: "var(--negative)", border: "1px solid rgba(251,113,133,0.3)" },
  };
  return <button disabled={disabled} onClick={onClick} className={`${base} ${className}`} style={{ ...variants[variant], ...style }}>{children}</button>;
}

function IconBtn({ icon, onClick, className = "", size = 18, style = {} }) {
  return (
    <button onClick={onClick} className={`w-10 h-10 rounded-full flex items-center justify-center transition active:scale-90 shrink-0 ${className}`} style={{ background: "var(--glass-bg)", border: "1px solid var(--glass-border)", color: "var(--text-primary)", ...style }}>

  );
}

function CustomersScreen({ customers, transactions, settings, onOpen, onAdd }) {

  let list = customers.map((c) => ({ ...c, bal: getBalance(c, transactions) }));

function SplitBillScreen({ customers, settings, onConfirm }) {
  const [amount, setAmount] = useState("");
  const [desc, setDesc] = useState("");
  const [selected, setSelected] = useState([]);
  const [mode, setMode] = useState("equal");
  const [customVals, setCustomVals] = useState({});
  const symbol = CURRENCIES[settings.currency] || settings.currency;
  const total = Number(amount) || 0;

  const toggle = (id) => {
    setSelected((prev) => {
      if (prev.includes(id)) return prev.filter((x) => x !== id);
      if (prev.length >= 4) return prev;
      return [...prev, id];
    });
  };

  const shares = useMemo(() => {
    if (selected.length === 0) return {};
    if (mode === "equal") { const each = total / selected.length; const obj = {}; selected.forEach((id) => (obj[id] = each)); return obj; }
    if (mode === "custom") { const obj = {}; selected.forEach((id) => (obj[id] = Number(customVals[id]) || 0)); return obj; }
    if (mode === "percentage") { const obj = {}; selected.forEach((id) => (obj[id] = (total * (Number(customVals[id]) || 0)) / 100)); return obj; }
    return {};
  }, [selected, mode, customVals, total]);

  const sum = Object.values(shares).reduce((a, b) => a + b, 0);
  const diff = Math.round((total - sum) * 100) / 100;
  const valid = selected.length > 0 && total > 0 && Math.abs(diff) < 0.5 && desc.trim();

  return (
    <div className="space-y-4 pb-28 md:pb-8">
      <h1 className="font-display text-2xl font-bold" style={{ color: "var(--text-primary)" }}>Split Bill</h1>
      <GlassCard className="p-4 space-y-3">
        <Field label="Total bill amount"><TextInput type="number" placeholder="0" value={amount} onChange={(e) => setAmount(e.target.value)} /></Field>
        <Field label="Bill description"><TextInput placeholder="e.g. Dinner order, Grocery bill" value={desc} onChange={(e) => setDesc(e.target.value)} /></Field>
      </GlassCard>

      <GlassCard className="p-4">
        <h3 className="text-sm font-semibold mb-3" style={{ color: "var(--text-primary)" }}>Select customers <span style={{ color: "var(--text-secondary)", fontWeight: 400 }}>({selected.length}/4)</span></h3>
        <div className="grid grid-cols-2 gap-2.5 max-h-64 overflow-y-auto">
          {customers.map((c) => {
            const isSel = selected.includes(c.id);
            return (
              <button key={c.id} onClick={() => toggle(c.id)} disabled={!isSel && selected.length >= 4} className="flex items-center gap-2 p-2.5 rounded-xl transition disabled:opacity-30" style={{ background: isSel ? "rgba(245,165,36,0.15)" : "var(--glass-bg)", border: isSel ? "1px solid var(--accent)" : "1px solid var(--glass-border)" }}>
                <div className="w-8 h-8 rounded-full flex items-center justify-center text-xs font-semibold shrink-0" style={{ background: c.avatarColor + "33", color: c.avatarColor }}>{c.name.charAt(0)}</div>
                <span className="text-xs font-medium truncate" style={{ color: "var(--text-primary)" }}>{c.name}</span>
                {isSel && <IconR name="Check" size={14} className="ml-auto shrink-0" style={{ color: "var(--accent)" }} />}
              </button>
            );
          })}
        </div>
      </GlassCard>

      {selected.length > 0 && (
        <GlassCard className="p-4 space-y-3">
          <div className="flex gap-2">
            {[["equal", "Equal"], ["custom", "Custom"], ["percentage", "Percentage"]].map(([k, l]) => (

function ReportsScreen({ customers, transactions, settings }) {
  const [range, setRange] = useState("month");
  const [custom, setCustom] = useState({ from: "", to: "" });
  const symbol = CURRENCIES[settings.currency] || settings.currency;
  const { from, to } = range === "custom"
    ? { from: custom.from ? startOfDay(new Date(custom.from)) : null, to: custom.to ? endOfDay(new Date(custom.to)) : null }
    : getRangeDates(range);

  const filtered = transactions.filter((t) => (range === "all" ? true : inRange(t.date, from, to)));
  const creditTotal = filtered.filter((t) => t.type === "credit").reduce((s, t) => s + Number(t.amount), 0);
  const debitTotal = filtered.filter((t) => t.type === "debit").reduce((s, t) => s + Number(t.amount), 0);
  const balances = customers.map((c) => ({ c, bal: getBalance(c, transactions) }));
  const totalReceivable = balances.filter((b) => b.bal > 0).reduce((s, b) => s + b.bal, 0);
  const totalPayable = balances.filter((b) => b.bal < 0).reduce((s, b) => s + Math.abs(b.bal), 0);
  const totalOutstanding = totalReceivable + totalPayable;

  const exportCsv = () => {
    let csv = "Date,Customer,Type,Amount,Description,Payment Method,Receipt Number\n";
    filtered.forEach((t) => {
      const cust = customers.find((c) => c.id === t.customerId);
      csv += `${formatDate(t.date)},${cust?.name || ""},${t.type},${t.amount},"${t.description}",${t.paymentMethod},${t.receiptNumber}\n`;
    });
    downloadFile(`report-${Date.now()}.csv`, csv, "text/csv");
  };

  return (
    <div className="space-y-4 pb-28 md:pb-8">
      <div className="flex items-center justify-between">
        <h1 className="font-display text-2xl font-bold" style={{ color: "var(--text-primary)" }}>Reports</h1>
        <Btn variant="ghost" onClick={exportCsv}><IconR name="Download" size={15} /> Export</Btn>
      </div>
      <div className="flex gap-2 overflow-x-auto">
        {[["today", "Today"], ["yesterday", "Yesterday"], ["week", "This week"], ["month", "This month"], ["all", "All time"], ["custom", "Custom"]].map(([k, l]) => (
          <button key={k} onClick={() => setRange(k)} className="px-3.5 py-1.5 rounded-full text-xs font-medium whitespace-nowrap" style={range === k ? { background: "var(--accent)", color: "#1A1204" } : { background: "var(--glass-bg)", color: "var(--text-secondary)", border: "1px solid var(--glass-border)" }}>{l}</button>
        ))}
      </div>
      {range === "custom" && (
        <div className="flex gap-2">
          <TextInput type="date" value={custom.from} onChange={(e) => setCustom((v) => ({ ...v, from: e.target.value }))} />
          <TextInput type="date" value={custom.to} onChange={(e) => setCustom((v) => ({ ...v, to: e.target.value }))} />
        </div>
      )}
      <div className="grid grid-cols-2 gap-3">
        <GlassCard className="p-4"><p className="text-xs" style={{ color: "var(--text-secondary)" }}>Credit given</p><p className="font-display text-lg font-bold" style={{ color: "var(--positive)" }}>{formatMoney(creditTotal, symbol)}</p></GlassCard>
        <GlassCard className="p-4"><p className="text-xs" style={{ color: "var(--text-secondary)" }}>Collected</p><p className="font-display text-lg font-bold" style={{ color: "var(--negative)" }}>{formatMoney(debitTotal, symbol)}</p></GlassCard>
        <GlassCard className="p-4"><p className="text-xs" style={{ color: "var(--text-secondary)" }}>Total receivable</p><p className="font-display text-lg font-bold" style={{ color: "var(--positive)" }}>{formatMoney(totalReceivable, symbol)}</p></GlassCard>
        <GlassCard className="p-4"><p className="text-xs" style={{ color: "var(--text-secondary)" }}>Total payable</p><p className="font-display text-lg font-bold" style={{ color: "var(--negative)" }}>{formatMoney(totalPayable, symbol)}</p></GlassCard>
      </div>
      <GlassCard className="p-4">
        <p className="text-xs mb-1" style={{ color: "var(--text-secondary)" }}>Total outstanding</p>
        <p className="font-display text-2xl font-bold" style={{ color: "var(--text-primary)" }}>{formatMoney(totalOutstanding, symbol)}</p>
      </GlassCard>
      <div>
        <h3 className="text-sm font-semibold mb-2" style={{ color: "var(--text-primary)" }}>Customer-wise balances</h3>
        <GlassCard className="p-2">
          {balances.filter((b) => b.bal !== 0).sort((a, b) => Math.abs(b.bal) - Math.abs(a.bal)).map((b, i, arr) => (
            <div key={b.c.id} className="flex items-center justify-between p-2.5" style={{ borderBottom: i < arr.length - 1 ? "1px solid var(--glass-border)" : "none" }}>
              <span className="text-sm" style={{ color: "var(--text-primary)" }}>{b.c.name}</span>
              <span className="text-sm font-semibold" style={{ color: b.bal > 0 ? "var(--positive)" : "var(--negative)" }}>{formatMoney(Math.abs(b.bal), symbol)}</span>
            </div>
          ))}
          {balances.every((b) => b.bal === 0) && <p className="text-sm p-3" style={{ color: "var(--text-secondary)" }}>All accounts settled.</p>}
        </GlassCard>
      </div>
    </div>
  );
}

function LockScreen({ onUnlock, correctPin, businessName }) {
  const [pin, setPin] = useState("");
  const [error, setError] = useState(false);
  const submit = (val) => {
    if (val === correctPin) onUnlock();
    else { setError(true); setTimeout(() => { setError(false); setPin(""); }, 450); }
  };
  const press = (d) => {
    const np = (pin + d).slice(0, 4);
    setPin(np);
    if (np.length === 4) submit(np);
  };
  return (
    <div className="fixed inset-0 z-[100] flex flex-col items-center justify-center gap-8" style={{ background: "linear-gradient(180deg, var(--bg-grad-1), var(--bg-grad-2))" }}>
      <div className="text-center">
        <div className="w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4" style={{ background: "var(--glass-bg)", border: "1px solid var(--glass-border)" }}><IconR name="Lock" size={24} style={{ color: "var(--accent)" }} /></div>
        <p className="font-display text-lg font-semibold" style={{ color: "var(--text-primary)" }}>{businessName || "Khata"}</p>
        <p className="text-sm mt-1" style={{ color: "var(--text-secondary)" }}>Enter your PIN to continue</p>
      </div>
      <div className={`flex gap-3 ${error ? "shake" : ""}`}>
        {[0, 1, 2, 3].map((i) => (
          <div key={i} className="w-3.5 h-3.5 rounded-full" style={{ background: i < pin.length ? (error ? "var(--negative)" : "var(--accent)") : "var(--glass-bg)", border: "1px solid var(--glass-border)" }} />
        ))}
      </div>
      <div className="grid grid-cols-3 gap-4">
        {["1", "2", "3", "4", "5", "6", "7", "8", "9", "", "0", "del"].map((d, i) => d === "" ? <div key={i} /> : (
          <button key={i} onClick={() => (d === "del" ? setPin((p) => p.slice(0, -1)) : press(d))} className="w-16 h-16 rounded-full flex items-center justify-center text-lg font-medium transition active:scale-90" style={{ background: "var(--glass-bg)", border: "1px solid var(--glass-border)", color: "var(--text-primary)" }}>
            {d === "del" ? "⌫" : d}
          </button>
        ))}
      </div>
    </div>
  );
}

function PinSetupModal({ open, onClose, onSave }) {
  const [step, setStep] = useState(1);
  const [pin1, setPin1] = useState("");
  const [pin2, setPin2] = useState("");
  const [error, setError] = useState("");
  useEffect(() => { if (open) { setStep(1); setPin1(""); setPin2(""); setError(""); } }, [open]);

  const handlePress = (d) => {
    if (step === 1) {
      if (d === "del") return setPin1((p) => p.slice(0, -1));
      const np = (pin1 + d).slice(0, 4); setPin1(np);
      if (np.length === 4) setStep(2);
    } else {
      if (d === "del") return setPin2((p) => p.slice(0, -1));
      const np = (pin2 + d).slice(0, 4); setPin2(np);
      if (np.length === 4) {
        if (np === pin1) onSave(np);
        else { setError("PINs don't match, try again."); setPin1(""); setPin2(""); setStep(1); }
      }
    }
  };

  return (
    <Modal open={open} onClose={onClose} title={step === 1 ? "Set new PIN" : "Confirm PIN"}>
      <div className="flex flex-col items-center gap-6 py-4">
        <div className="flex gap-3">
          {[0, 1, 2, 3].map((i) => (
            <div key={i} className="w-3.5 h-3.5 rounded-full" style={{ background: i < (step === 1 ? pin1 : pin2).length ? "var(--accent)" : "var(--glass-bg)", border: "1px solid var(--glass-border)" }} />
          ))}
        </div>
        {error && <p className="text-xs" style={{ color: "var(--negative)" }}>{error}</p>}
        <div className="grid grid-cols-3 gap-3">
          {["1", "2", "3", "4", "5", "6", "7", "8", "9", "", "0", "del"].map((d, i) => d === "" ? <div key={i} /> : (
            <button key={i} onClick={() => handlePress(d)} className="w-14 h-14 rounded-full flex items-center justify-center text-base font-medium" style={{ background: "var(--glass-bg)", border: "1px solid var(--glass-border)", color: "var(--text-primary)" }}>{d === "del" ? "⌫" : d}</button>
          ))}
        </div>
      </div>
    </Modal>
  );
}

        <div className="flex gap-2">
          <button onClick={() => set("type", "credit")} className="flex-1 py-2.5 rounded-xl text-sm font-medium flex items-center justify-center gap-1.5" style={form.type === "credit" ? { background: "rgba(52,211,153,0.2)", color: "var(--positive)", border: "1px solid var(--positive)" } : { background: "var(--glass-bg)", color: "var(--text-secondary)", border: "1px solid var(--glass-border)" }}><IconR name="ArrowUpRight" size={14} /> Credit</button>
          <button onClick={() => set("type", "debit")} className="flex-1 py-2.5 rounded-xl text-sm font-medium flex items-center justify-center gap-1.5" style={form.type === "debit" ? { background: "rgba(251,113,133,0.2)", color: "var(--negative)", border: "1px solid var(--negative)" } : { background: "var(--glass-bg)", color: "var(--text-secondary)", border: "1px solid var(--glass-border)" }}><IconR name="ArrowDownRight" size={14} /> Debit</button>
        </div>
        <Field label="Amount *"><TextInput type="number" value={form.amount} onChange={(e) => set("amount", e.target.value)} placeholder="0" /></Field>
        <Field label="Description *"><TextInput value={form.description} onChange={(e) => set("description", e.target.value)} placeholder="e.g. Grocery items" /></Field>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Payment method">
            <Select value={form.paymentMethod} onChange={(e) => set("paymentMethod", e.target.value)} options={[{ value: "Cash", label: "Cash" }, { value: "Bank Transfer", label: "Bank Transfer" }, { value: "JazzCash", label: "JazzCash" }, { value: "EasyPaisa", label: "EasyPaisa" }, { value: "Card", label: "Card" }, { value: "Other", label: "Other" }]} />
          </Field>
          <Field label="Reference number"><TextInput value={form.referenceNumber} onChange={(e) => set("referenceNumber", e.target.value)} /></Field>
        </div>
        <Field label="Date & time"><TextInput type="datetime-local" value={form.date} onChange={(e) => set("date", e.target.value)} /></Field>
        <Field label="Notes"><TextArea rows={2} value={form.notes} onChange={(e) => set("notes", e.target.value)} /></Field>
        <Btn className="w-full mt-2" disabled={!canSave} onClick={() => onSave({ ...form, amount: Number(form.amount) })}>Save transaction</Btn>
      </div>
    </Modal>
  );
}

function ReceiptModal({ open, onClose, txn, customer, settings, onSendWhatsApp }) {
  if (!open || !txn) return null;
  const symbol = CURRENCIES[settings.currency] || settings.currency;
  const prevBalance = (txn.runningBalance ?? 0) - (txn.type === "credit" ? txn.amount : -txn.amount);
  const msg = (settings.defaultWhatsAppMessage || "")
    .replace("{name}", customer?.name || "")
    .replace("{description}", txn.description)
    .replace("{amount}", formatMoney(txn.amount, symbol))
    .replace("{previousBalance}", formatMoney(prevBalance, symbol))
    .replace("{newBalance}", formatMoney(txn.runningBalance ?? 0, symbol))
    .replace("{date}", formatDate(txn.date));

  return (
    <Modal open={open} onClose={onClose} title="Receipt">
      <div id="receipt-print" className="rounded-2xl p-5 space-y-4" style={{ background: "#fff", color: "#111" }}>
        <div className="text-center space-y-1">
          <h2 className="font-bold text-lg">{settings.businessName}</h2>
          <p className="text-xs text-gray-500">{settings.address}</p>
          <p className="text-xs text-gray-500">{settings.phone}</p>
        </div>
        <div className="flex justify-between text-xs text-gray-500 border-t border-b border-gray-200 py-2">
          <span>{txn.receiptNumber}</span>
          <span>{formatDateTime(txn.date)}</span>
        </div>
        <div className="text-sm space-y-1">
          <div className="flex justify-between"><span className="text-gray-500">Customer</span><span className="font-medium">{customer?.name}</span></div>
          <div className="flex justify-between"><span className="text-gray-500">Phone</span><span>{customer?.phone}</span></div>
          <div className="flex justify-between"><span className="text-gray-500">Description</span><span>{txn.description}</span></div>
          <div className="flex justify-between"><span className="text-gray-500">Payment method</span><span>{txn.paymentMethod}</span></div>
          <div className="flex justify-between"><span className="text-gray-500">Status</span><span className="capitalize">{txn.type === "credit" ? "Credit given" : "Payment received"}</span></div>
        </div>
        <div className="border-t border-gray-200 pt-2 text-sm space-y-1">
          <div className="flex justify-between"><span className="text-gray-500">Previous balance</span><span>{formatMoney(prevBalance, symbol)}</span></div>
          <div className="flex justify-between font-semibold"><span>{txn.type === "credit" ? "Amount added" : "Amount paid"}</span><span>{formatMoney(txn.amount, symbol)}</span></div>
          <div className="flex justify-between font-bold text-base border-t border-gray-200 pt-1"><span>New balance</span><span>{formatMoney(txn.runningBalance ?? 0, symbol)}</span></div>
        </div>
        <p className="text-center text-xs text-gray-500 pt-2">{settings.receiptFooter}</p>
      </div>
      <div className="grid grid-cols-2 gap-3 mt-4">
        <Btn variant="ghost" onClick={() => window.print()}><IconR name="Printer" size={14} /> Print</Btn>
        <Btn onClick={() => onSendWhatsApp(customer?.phone, msg)}><IconR name="MessageCircle" size={14} /> WhatsApp</Btn>
      </div>
    </Modal>
  );
}

function SplitPreviewModal({ open, onClose, data, settings, onConfirm }) {
  if (!open || !data) return null;
  const symbol = CURRENCIES[settings.currency] || settings.currency;
  return (
    <Modal open={open} onClose={onClose} title="Split bill preview">
      <div className="space-y-3">
        <GlassCard className="p-3"><p className="text-xs" style={{ color: "var(--text-secondary)" }}>{data.description}</p><p className="font-display text-xl font-bold" style={{ color: "var(--text-primary)" }}>{formatMoney(data.amount, symbol)}</p></GlassCard>
        <div className="space-y-2">
          {data.customers.map((c) => (
            <div key={c.id} className="flex items-center gap-3">
              <div className="w-8 h-8 rounded-full flex items-center justify-center text-xs font-semibold" style={{ background: c.avatarColor + "33", color: c.avatarColor }}>{c.name.charAt(0)}</div>
              <span className="text-sm flex-1" style={{ color: "var(--text-primary)" }}>{c.name}</span>
              <span className="text-sm font-semibold" style={{ color: "var(--positive)" }}>{formatMoney(data.shares[c.id] || 0, symbol)}</span>
            </div>
          ))}
        </div>
        <p className="text-xs" style={{ color: "var(--text-secondary)" }}>Each customer's Khata will be updated and a receipt generated automatically.</p>
        <Btn className="w-full" onClick={onConfirm}><IconR name="Check" size={15} /> Confirm & save</Btn>
      </div>
    </Modal>
  );
}

function SplitSuccessModal({ open, onClose, results, settings, onSendWhatsApp, onOpenReceipt }) {
  if (!open) return null;
  const symbol = CURRENCIES[settings.currency] || settings.currency;
  return (
    <Modal open={open} onClose={onClose} title="Split bill saved">
      <div className="space-y-3">
        <div className="text-center py-2"><IconR name="Check" size={32} style={{ color: "var(--positive)" }} className="mx-auto mb-2" /><p className="text-sm" style={{ color: "var(--text-secondary)" }}>Transactions added to each customer's ledger.</p></div>
        {results.map((r) => (
          <GlassCard key={r.txn.id} className="p-3 flex items-center gap-3">
            <div className="flex-1"><p className="text-sm font-medium" style={{ color: "var(--text-primary)" }}>{r.customer.name}</p><p className="text-xs" style={{ color: "var(--text-secondary)" }}>{formatMoney(r.txn.amount, symbol)} · {r.txn.receiptNumber}</p></div>
            <button onClick={() => onOpenReceipt(r.txn, r.customer)}><IconR name="FileText" size={16} style={{ color: "var(--text-secondary)" }} /></button>
            <button onClick={() => onSendWhatsApp(r.customer.phone, `Assalam-o-Alaikum,\n\nYour share of the split bill:\nAmount: ${formatMoney(r.txn.amount, symbol)}\nDescription: ${r.txn.description}\nNew Balance: ${formatMoney(r.txn.runningBalance, symbol)}\n\nThank you.`)}><IconR name="MessageCircle" size={16} style={{ color: "var(--positive)" }} /></button>
          </GlassCard>
        ))}
      </div>
    </Modal>
  );
}

// ---------------------------- Root App --------------------------------------
function App() {
  const [loading, setLoading] = useState(true);
  const [customers, setCustomers] = useState([]);
  const [transactions, setTransactions] = useState([]);
  const [settings, setSettings] = useState(null);
  const [screen, setScreen] = useState("dashboard");
  const [selectedCustomerId, setSelectedCustomerId] = useState(null);
  const [locked, setLocked] = useState(false);
  const [toast, setToast] = useState(null);
  const loadedRef = useRef(false);

  const [customerModal, setCustomerModal] = useState({ open: false, initial: null });
  const [txnModal, setTxnModal] = useState({ open: false, customer: null, type: "credit" });
  const [receiptModal, setReceiptModal] = useState({ open: false, txn: null, customer: null });
  const [confirmDialog, setConfirmDialog] = useState({ open: false, title: "", message: "", onConfirm: null });
  const [searchOpen, setSearchOpen] = useState(false);
  const [pinSetupOpen, setPinSetupOpen] = useState(false);
  const [splitPreview, setSplitPreview] = useState({ open: false, data: null });
  const [splitSuccess, setSplitSuccess] = useState({ open: false, results: [] });

  useEffect(() => {
    let cancelled = false;
    (async () => {
      let data = null;
      try {
        const res = await window.storage.get("khata-store");
        if (res && res.value) data = JSON.parse(res.value);
      } catch (e) { /* fall through to seed */ }
      if (!data) data = seedDemoData();
      if (cancelled) return;
      setCustomers(data.customers || []);
      setTransactions(data.transactions || []);
      setSettings(data.settings || seedDemoData().settings);
      setLocked(!!(data.settings && data.settings.pinEnabled));
      setLoading(false);
      loadedRef.current = true;
    })();
    return () => { cancelled = true; };
  }, []);

  useEffect(() => {
    if (!loadedRef.current || loading || !settings) return;
    (async () => {
      try { await window.storage.set("khata-store", JSON.stringify({ customers, transactions, settings })); }
      catch (e) { /* best effort persistence */ }
    })();
  }, [customers, transactions, settings, loading]);

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2200); };

  if (loading || !settings) {
    return (
      <div className="fixed inset-0 flex items-center justify-center" style={{ background: "#0B1120" }}>
        <div className="w-8 h-8 rounded-full border-2 animate-spin" style={{ borderColor: "rgba(245,165,36,0.25)", borderTopColor: "#F5A524" }} />
      </div>
    );
  }

  if (locked) {
    return (
      <div className={`theme-${settings.theme}`}>
        <style>{GLOBAL_CSS}</style>
        <LockScreen correctPin={settings.pin} businessName={settings.businessName} onUnlock={() => setLocked(false)} />
      </div>
    );
  }

  const selectedCustomer = customers.find((c) => c.id === selectedCustomerId);

  const openCustomer = (id) => { setSelectedCustomerId(id); setScreen("customerDetail"); };

  const saveCustomer = (data) => {
    if (data.id) {
      setCustomers((cs) => cs.map((c) => (c.id === data.id ? { ...c, ...data } : c)));
      showToast("Customer updated");
    } else {
      const newCust = { ...data, id: uid("c"), createdAt: new Date().toISOString(), status: "active" };
      setCustomers((cs) => [...cs, newCust]);
      showToast("Customer added");
    }
    setCustomerModal({ open: false, initial: null });
  };

  const deleteCustomer = (customer) => {
    setConfirmDialog({
      open: true,
      title: "Delete customer?",
      message: `This will permanently delete ${customer.name} and all their transaction history. This cannot be undone.`,
      onConfirm: () => {
        setCustomers((cs) => cs.filter((c) => c.id !== customer.id));
        setTransactions((ts) => ts.filter((t) => t.customerId !== customer.id));
        setConfirmDialog({ open: false });
        setScreen("customers");
        showToast("Customer deleted");
      },
    });
  };

  const saveTransaction = (data) => {
    const customer = txnModal.customer;
    if (data.id) {
      setTransactions((ts) => ts.map((t) => (t.id === data.id ? { ...t, ...data, date: new Date(data.date).toISOString() } : t)));
      showToast("Transaction updated");
    } else {
      const receiptNumber = nextReceiptNumber(settings.receiptCounter);
      const newTxn = { ...data, id: uid("t"), customerId: customer.id, receiptNumber, createdAt: Date.now(), date: new Date(data.date).toISOString() };
      setTransactions((ts) => [...ts, newTxn]);
      setSettings((s) => ({ ...s, receiptCounter: s.receiptCounter + 1 }));
      showToast("Transaction saved");
    }
    setTxnModal({ open: false, customer: null, type: "credit" });
  };

  const deleteTransaction = (txn) => {
    setConfirmDialog({
      open: true,
      title: "Delete transaction?",
      message: "This will remove the transaction and recalculate the ledger balance. This cannot be undone.",
      onConfirm: () => {
        setTransactions((ts) => ts.filter((t) => t.id !== txn.id));
        setConfirmDialog({ open: false });
        showToast("Transaction deleted");
      },
    });
  };

  const openReceipt = (txn, customer) => setReceiptModal({ open: true, txn, customer });

  const sendWhatsApp = (phone, message) => {
    if (!phone) { showToast("No phone number on file"); return; }
    window.open(buildWhatsAppLink(phone, message), "_blank");
  };

  const handleQuickAction = (id) => {
    if (id === "addCustomer") setCustomerModal({ open: true, initial: null });
    else if (id === "addTransaction") { if (!customers.length) return showToast("Add a customer first"); setTxnModal({ open: true, customer: customers[0], type: "credit" }); }
    else if (id === "receivePayment") { if (!customers.length) return showToast("Add a customer first"); setTxnModal({ open: true, customer: customers[0], type: "debit", label: "Receive payment" }); }
    else if (id === "sendPayment") { if (!customers.length) return showToast("Add a customer first"); setTxnModal({ open: true, customer: customers[0], type: "credit", label: "Send payment" }); }
    else if (id === "splitBill") setScreen("split");
    else if (id === "sendReceipt") {
      if (!transactions.length) return showToast("No transactions yet");
      const last = transactions.slice().sort((a, b) => b.createdAt - a.createdAt)[0];
      const cust = customers.find((c) => c.id === last.customerId);
      const rows = ledgerWithRunning(cust, transactions);
      const row = rows.find((r) => r.id === last.id);
      openReceipt(row || last, cust);
    }
  };

  const confirmSplit = (data) => setSplitPreview({ open: true, data });

  const finalizeSplit = () => {
    const data = splitPreview.data;
    let counter = settings.receiptCounter;
    const newTxns = [];
    data.customers.forEach((c) => {
      const receiptNumber = nextReceiptNumber(counter); counter++;
      newTxns.push({ id: uid("t"), customerId: c.id, date: new Date().toISOString(), type: "credit", amount: Math.round((data.shares[c.id] || 0) * 100) / 100, description: `Split bill: ${data.description}`, paymentMethod: "Split Bill", referenceNumber: "", notes: "", receiptNumber, createdAt: Date.now(), splitBillId: uid("split") });
    });
    const mergedTxns = [...transactions, ...newTxns];
    setTransactions(mergedTxns);
    setSettings((s) => ({ ...s, receiptCounter: counter }));
    const results = newTxns.map((t) => {
      const cust = customers.find((c) => c.id === t.customerId);
      const rows = ledgerWithRunning(cust, mergedTxns);
      const row = rows.find((r) => r.id === t.id) || t;
      return { txn: row, customer: cust };
    });
    setSplitPreview({ open: false, data: null });
    setSplitSuccess({ open: true, results });
    setScreen("dashboard");
  };

  const exportBackup = () => downloadFile(`khata-backup-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify({ customers, transactions, settings }, null, 2));

  const importBackup = (file) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const parsed = JSON.parse(e.target.result);
        if (parsed.customers && parsed.transactions && parsed.settings) {
          setCustomers(parsed.customers); setTransactions(parsed.transactions); setSettings(parsed.settings);
          showToast("Backup restored");
        } else showToast("Invalid backup file");
      } catch (err) { showToast("Could not read backup file"); }
    };
    reader.readAsText(file);
  };

  const screens = {
    dashboard: <Dashboard customers={customers} transactions={transactions} settings={settings} onNav={setScreen} onQuickAction={handleQuickAction} onOpenCustomer={openCustomer} />,
    customers: <CustomersScreen customers={customers} transactions={transactions} settings={settings} onOpen={openCustomer} onAdd={() => setCustomerModal({ open: true, initial: null })} />,
    customerDetail: selectedCustomer ? (
      <CustomerDetail
        customer={selectedCustomer}
        transactions={transactions}
        settings={settings}
        onBack={() => setScreen("customers")}
        onEdit={(c) => setCustomerModal({ open: true, initial: c })}
        onDelete={deleteCustomer}
        onAddTxn={(c, type, isSend) => setTxnModal({ open: true, customer: c, type, label: isSend ? "Send payment" : undefined })}
        onOpenReceipt={openReceipt}
        onSendWhatsApp={sendWhatsApp}
        onEditTxn={(t) => setTxnModal({ open: true, customer: selectedCustomer, type: t.type, editData: t })}
        onDeleteTxn={deleteTransaction}
      />
    ) : <EmptyState icon="Users" title="No customer selected" />,
    transactions: <TransactionsScreen customers={customers} transactions={transactions} settings={settings} onOpenReceipt={openReceipt} onOpenCustomer={openCustomer} />,
    split: <SplitBillScreen customers={customers} settings={settings} onConfirm={confirmSplit} />,
    reports: <ReportsScreen customers={customers} transactions={transactions} settings={settings} />,
    settings: (
      <SettingsScreen
        settings={settings}
        onSave={(f) => { setSettings((s) => ({ ...s, ...f })); showToast("Settings saved"); }}
        onExport={exportBackup}
        onImport={importBackup}
        onTogglePin={() => {
          if (!settings.pinEnabled && !settings.pin) setPinSetupOpen(true);
          else setSettings((s) => ({ ...s, pinEnabled: !s.pinEnabled }));
        }}
        onChangePin={() => setPinSetupOpen(true)}
      />
    ),
  };

  return (
    <div className={`theme-${settings.theme} min-h-screen relative`} style={{ background: "linear-gradient(180deg, var(--bg-grad-1), var(--bg-grad-2))" }}>
      <style>{GLOBAL_CSS}</style>

      <div className="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
        <div className="absolute -top-24 -left-24 w-72 h-72 rounded-full" style={{ background: "var(--accent)", opacity: 0.15, filter: "blur(90px)" }} />
        <div className="absolute top-1/3 -right-24 w-80 h-80 rounded-full" style={{ background: "var(--positive)", opacity: 0.12, filter: "blur(100px)" }} />
      </div>

      <ToastView toast={toast} />

      <div className="hidden md:flex fixed left-0 top-0 bottom-0 w-60 flex-col p-5 gap-1 z-30" style={{ borderRight: "1px solid var(--glass-border)" }}>
        <div className="flex items-center gap-2.5 mb-8 px-2">
          <div className="w-9 h-9 rounded-xl flex items-center justify-center font-bold shrink-0" style={{ background: "var(--accent)", color: "#1A1204" }}>{(settings.businessName || "K").charAt(0)}</div>
          <span className="font-display font-semibold text-sm truncate" style={{ color: "var(--text-primary)" }}>{settings.businessName}</span>
        </div>
        {NAV_ITEMS.map((n) => (
          <button key={n.id} onClick={() => { setScreen(n.id); if (n.id !== "customerDetail") setSelectedCustomerId(null); }} className="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition" style={(screen === n.id || (n.id === "customers" && screen === "customerDetail")) ? { background: "var(--glass-bg)", color: "var(--accent)" } : { color: "var(--text-secondary)" }}>
            <IconR name={n.icon} size={18} /> {n.label}
          </button>
        ))}
        <button onClick={() => setSearchOpen(true)} className="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium mt-2" style={{ color: "var(--text-secondary)" }}><IconR name="Search" size={18} /> Search</button>
      </div>

      <div className="md:ml-60 max-w-3xl mx-auto px-4 pt-6 md:px-8">
        {screens[screen]}
      </div>

      <div className="md:hidden fixed bottom-0 left-0 right-0 z-30 px-3 pb-3">
        <div className="glass rounded-3xl flex items-center justify-around py-2" style={{ background: "var(--glass-bg-strong)" }}>
          {NAV_ITEMS.map((n) => {
            const active = screen === n.id || (n.id === "customers" && screen === "customerDetail");
            return (
              <button key={n.id} onClick={() => { setScreen(n.id); if (n.id !== "customerDetail") setSelectedCustomerId(null); }} className="flex flex-col items-center gap-0.5 px-2 py-1.5 rounded-xl transition">
                <IconR name={n.icon} size={19} style={{ color: active ? "var(--accent)" : "var(--text-secondary)" }} />
                <span className="text-[9.5px] font-medium" style={{ color: active ? "var(--accent)" : "var(--text-secondary)" }}>{n.label}</span>
              </button>
            );
          })}
        </div>
      </div>

      <button onClick={() => setSearchOpen(true)} className="md:hidden fixed top-5 right-4 z-30 w-10 h-10 rounded-full flex items-center justify-center glass" style={{ background: "var(--glass-bg-strong)" }}>
        <IconR name="Search" size={17} style={{ color: "var(--text-primary)" }} />
      </button>

      <CustomerFormModal open={customerModal.open} initial={customerModal.initial} onClose={() => setCustomerModal({ open: false, initial: null })} onSave={saveCustomer} />
      <TransactionFormModal open={txnModal.open} customer={txnModal.customer} defaultType={txnModal.type} defaultLabel={txnModal.label} editData={txnModal.editData} onClose={() => setTxnModal({ open: false, customer: null, type: "credit" })} onSave={saveTransaction} />
      <ReceiptModal open={receiptModal.open} txn={receiptModal.txn} customer={receiptModal.customer} settings={settings} onClose={() => setReceiptModal({ open: false, txn: null, customer: null })} onSendWhatsApp={sendWhatsApp} />
      <ConfirmDialog open={confirmDialog.open} title={confirmDialog.title} message={confirmDialog.message} onClose={() => setConfirmDialog({ open: false })} onConfirm={confirmDialog.onConfirm} />
      <SearchOverlay open={searchOpen} onClose={() => setSearchOpen(false)} customers={customers} transactions={transactions} settings={settings} onOpenCustomer={openCustomer} />
      <PinSetupModal open={pinSetupOpen} onClose={() => setPinSetupOpen(false)} onSave={(pin) => { setSettings((s) => ({ ...s, pin, pinEnabled: true })); setPinSetupOpen(false); showToast("PIN set"); }} />
      <SplitPreviewModal open={splitPreview.open} data={splitPreview.data} settings={settings} onClose={() => setSplitPreview({ open: false, data: null })} onConfirm={finalizeSplit} />
      <SplitSuccessModal open={splitSuccess.open} results={splitSuccess.results} settings={settings} onClose={() => setSplitSuccess({ open: false, results: [] })} onSendWhatsApp={sendWhatsApp} onOpenReceipt={openReceipt} />
    </div>
  );
}


const rootEl = document.getElementById("root");
const root = ReactDOM.createRoot(rootEl);
root.render(React.createElement(App));

</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
